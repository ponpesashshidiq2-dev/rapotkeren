; Konfigurasi PHP untuk aplikasi Raport TK
; Aktifkan ekstensi SQLite (PDO) yang dibutuhkan aplikasi
; Catatan: sesuaikan extension_dir dengan lokasi PHP Anda bila perlu
extension=pdo_sqlite
extension=sqlite3
extension=zip
display_errors=On
error_reporting=E_ALL
upload_max_filesize=8M
post_max_size=16M
